<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2t</title>
    <style>
      body{
          font-family: 'Times New Roman';
          background-color: burlywood;
      }
      header{
          text-align: center;
      }
      section{
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            width: 600px;
            margin: auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      }
      input[type="text"], select, textarea,  input[type="submit"] {
            width: 94%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }
        img{
            display: block;
            margin: auto;
            height: 100px;
            width: 100px;
            padding: 0px;
        }

    </style>
</head>
<body>
    <header>
        <h1>RATE A MOVIE</h1>
        <br>
        <p>Write a movie review! There's a ton of movies out there that you could choose from, only choose 1 though.</p>
    </header>
    <br>
    <section>
        <form action="">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRBFJEX3LwSHzwP0GPzLiiPghci2h5edXBTHWhngBxi9g&s=10" alt="logo">
            <br>

             <label for="movie">Movie Title</label>
             <br>
            
             <input type="text" id="movie" name="movie" placeholder="Enter here">

             <br>

             <label for="">Genre/s</label>
             <br>
             <input type="checkbox" id="genre1" name="genre1">
             <label for="genre">inspirational</label>
             <input type="checkbox" id="genre2" name="genre2">
             <label for="genre">Romance</label>
             <input type="checkbox" id="genre3" name="genre3">
             <label for="genre">Coming-of-Age</label>
             <input type="checkbox" id="genre4" name="genre4">
             <label for="genre">Drama</label>
             <input type="checkbox" id="genre5" name="genre5">
             <label for="genre">Horror</label>
             <input type="checkbox" id="genre6" name="genre6">
             <label for="genre">Comedy</label>
             <input type="checkbox" id="genre7" name="genre7">
             <label for="genre">Action</label>
             <input type="checkbox" id="genre8" name="genre8">
             <label for="genre">Adventure</label>
             <input type="checkbox" id="genre9" name="genre9">
             <label for="genre">Science</label>
             <input type="checkbox" id="genre10" name="genre10">
             <label for="genre">Fantasy</label>

            <br>
            <label for="rating">Rating</label>
            <br>
            <input type="radio" id="rate1" name="rate">
            <label for="rate1">⭐</label>
            <input type="radio" id="rate2" name="rate">
            <label for="rate2">⭐⭐</label>
            <input type="radio" id="rate3" name="rate">
            <label for="rate3">⭐⭐⭐</label>
            <input type="radio" id="rate4" name="rate">
            <label for="rate4">⭐⭐⭐⭐</label>
            <input type="radio" id="rate5" name="rate">
            <label for="rate5">⭐⭐⭐⭐⭐</label>

            <br>
            <textarea id="review" placeholder="Write a review here..." rows="10" cols="20"></textarea>
            <br>

            <input type="submit" id="submit" value="Submit review">
            <br>

            Click <a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/" target="_blank">here</a>" for the guide in making a review.
            
        </form>
    </section>

    <!--Reference Nyfa, & Nyfa. (2024, March 23). How to write a movie review: 10 essential tips. NYFA. https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/-->
    <p>Coded by: Jas Pedro</p>
</body>
</html>
